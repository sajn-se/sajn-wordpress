name: sajn-wordpress

x-wp-env: &wp-env
    WORDPRESS_DB_HOST: db
    WORDPRESS_DB_USER: wordpress
    WORDPRESS_DB_PASSWORD: wordpress
    WORDPRESS_DB_NAME: wordpress
    WORDPRESS_DEBUG: 1
    WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SAJN_BASE_URL', getenv('SAJN_BASE_URL') ?: 'https://app.sajn.se');
    SAJN_BASE_URL: ${SAJN_BASE_URL:-http://host.docker.internal:3000}

services:
    db:
        image: mariadb:11
        environment:
            MARIADB_DATABASE: wordpress
            MARIADB_USER: wordpress
            MARIADB_PASSWORD: wordpress
            MARIADB_ROOT_PASSWORD: root
        volumes:
            - db-data:/var/lib/mysql

    wordpress:
        image: wordpress:php8.3-apache
        depends_on:
            - db
        ports:
            - "8088:80"
        environment: *wp-env
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - wp-data:/var/www/html
            - ./plugin/sajn:/var/www/html/wp-content/plugins/sajn

    cli:
        image: wordpress:cli-php8.3
        profiles: ["cli"]
        user: "33:33"
        depends_on:
            - db
        environment:
            <<: *wp-env
            HOME: /tmp
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - wp-data:/var/www/html
            - ./plugin/sajn:/var/www/html/wp-content/plugins/sajn

volumes:
    db-data:
    wp-data:
